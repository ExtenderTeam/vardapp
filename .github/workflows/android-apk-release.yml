name: Build and publish VárdApp APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, for example v0.1.0 (must already exist)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK and attach to GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Check Expo project
        working-directory: mobile
        run: npx expo-doctor

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build --platform android --profile preview --non-interactive --wait --json > ../eas-build.json
          APK_URL="$(jq -r 'if type == "array" then .[0].artifacts.buildUrl // empty else .artifacts.buildUrl // empty end' ../eas-build.json)"
          if [ -z "$APK_URL" ] || [ "$APK_URL" = "null" ]; then
            echo "EAS did not return an APK URL. See the build logs."
            cat ../eas-build.json
            exit 1
          fi
          curl --fail --location --retry 3 "$APK_URL" --output ../VardApp.apk
          test -s ../VardApp.apk

      - name: Determine release tag
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          else
            TAG="$INPUT_TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: VárdApp ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: VardApp.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
